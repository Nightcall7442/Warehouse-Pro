<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Приближение при фокусе этот тег НЕ отменяет, что бы тут раньше ни было
         написано. Safari на iPhone приближает страницу, когда поле мельче 16
         точек, и помогает только размер самого поля — правило для pointer:
         coarse в src/index.css. Отменить приближение мог бы maximum-scale=1,
         но iOS его игнорирует, а на остальных это отняло бы у людей щипок. -->
    <!-- interactive-widget: браузер сам сжимает разметку под клавиатуру, а не
         накрывает её. Safari на iOS этого пока не умеет — там же работает
         useKeyboardInset; вреда от подсказки нет ни там, ни там. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Warehouse Pro" />
    <!-- ── Оболочка приложения, а не страница сайта ─────────────────────────
         Этот файл — оболочка: её получают вошедший (по куке сессии) на «/»,
         разделы приложения (/orders, /login) и service worker без связи.
         Страницы сайта (/, /compare, /privacy, /uz, /uz/compare) гость
         получает готовыми из dist/prerender: сборка (scripts/prerender.mjs)
         заменяет блок между метками seo своим заголовком, описанием,
         canonical, hreflang, карточкой ссылки и разметкой schema.org на
         каждую страницу и язык (src/site/site-head.ts).

         Поэтому оболочка закрыта от поиска (noindex) и без canonical: её
         адреса — экраны приложения, а не страницы сайта. Раньше у неё был
         canonical на «/» — и каждый экран приложения сообщал поиску, что он
         и есть главная. Для /pitch и /demo сервер заменяет noindex на
         canonical своей страницы (api/lib/public-pages.ts).

         Карточка ссылки ниже — на случай, когда ссылку на экран приложения
         (/register, /login) присылают в Telegram: без неё в переписке был бы
         голый адрес. -->
    <!--seo-->
    <title>Warehouse Pro — агенты, долги магазинов и доставка в одной программе</title>
    <meta name="description" content="Программа для дистрибьюторов с торговыми агентами: заказы с телефона даже без сети, склад, доставка и долг каждого магазина. 14 дней бесплатно, без карты. Ургенч, Хорезм." />
    <meta name="robots" content="noindex" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Warehouse Pro" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:locale:alternate" content="uz_UZ" />
    <meta property="og:url" content="https://www.warehouse-pro.uz/" />
    <meta property="og:title" content="Warehouse Pro — агенты, долги магазинов и доставка в одной программе" />
    <meta property="og:description" content="Заказы с телефона агента даже без сети, склад, доставка и долг каждого магазина. 14 дней бесплатно, без карты." />
    <meta property="og:image" content="https://www.warehouse-pro.uz/og/home-ru.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Warehouse Pro — агенты, долги магазинов и доставка" />
    <meta name="twitter:description" content="Заказы с телефона агента даже без сети, склад и долг каждого магазина. 14 дней бесплатно." />
    <meta name="twitter:image" content="https://www.warehouse-pro.uz/og/home-ru.jpg" />
    <!--/seo-->
    <!-- Значок в выдаче поиска.
         /favicon.ico отдавал 404: тег rel="icon" был, а прямого запроса по
         корневому адресу — а его делают и поисковики, и браузеры — никто не
         обслуживал. Файл собран из icon-192.png тем же изображением.
         sizes="any" на ICO означает «подойдёт для любого размера»: браузер
         предпочтёт PNG нужного размера, а тот, кто спрашивает просто значок,
         получит ICO. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="icon" href="/icon-512.png" type="image/png" sizes="512x512" />
    <!-- Родной размер Apple — 180. Раньше сюда вёл icon-192, и iOS его
         пересжимала. Отдельный файл ещё и лежит по адресу, который часть
         версий iOS пробует напрямую, не заглядывая в разметку. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- VitePWA injects its own <link rel="manifest"> (manifest.webmanifest,
         generated from vite.config.ts) at build time. A hand-authored one
         used to sit here too, pointing at a hand-maintained public/manifest.json
         that had drifted from vite.config.ts. Two manifest links is undefined
         behaviour per spec — the browser picks one, and this one (being first
         in the head) is what iOS Safari was reading for "Add to Home Screen." -->
    <!-- Manrope и JetBrains Mono: у обоих есть кириллица. DM Sans её не имел, и
         каждое русское слово набиралось системным шрифтом — Segoe UI рядом с
         геометрической латиницей. Решение владельца от 07.09.2026 для мобилки,
         теперь и веб. Файлы — свои (public/fonts, @font-face в src/index.css),
         не с Google Fonts. Кириллический Manrope нужен первому же заголовку —
         браузер узнал бы о нём только из CSS, поэтому он предзагружается.
         crossorigin обязателен и для своего домена: шрифты грузятся в режиме
         CORS, без него предзагрузка не совпадёт с запросом и уйдёт впустую. -->
    <link rel="preload" href="/fonts/manrope-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <!-- ── Что видно до того, как загрузится приложение ────────────────────
         Короткий текст вместо белого поля — для медленной связи. Страницы
         сайта сборка заменяет здесь настоящей разметкой (scripts/
         prerender.mjs); в оболочке приложения он виден, пока едет скрипт.
         createRoot очищает контейнер при первой отрисовке. -->
    <!-- Метки root-fallback: их содержимое меняют сборка (страницы сайта) и
         сервер (/pitch и /demo, api/lib/public-pages.ts). -->
    <div id="root"><!--root-fallback-->
      <div style="max-width:640px;margin:0 auto;padding:64px 24px;font-family:'Manrope',system-ui,sans-serif;color:#1a1a1a">
        <h1 style="font-size:32px;line-height:1.15;letter-spacing:-0.03em;margin:0 0 16px">
          Warehouse Pro — агенты, долги магазинов и доставка в одной программе
        </h1>
        <p style="font-size:16px;line-height:1.6;margin:0 0 24px;color:#4a4a4a">
          Заказы с телефона агента даже без сети, склад, доставка и долг каждого магазина.
          Первые 14 дней бесплатно и без привязки карты.
        </p>
        <p style="font-size:16px;margin:0">
          <a href="/register" style="color:#1a1a1a">Начать бесплатно</a> ·
          <a href="/login" style="color:#1a1a1a">Войти</a>
        </p>
      </div>
    <!--/root-fallback--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
