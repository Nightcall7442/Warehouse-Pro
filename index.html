<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Mobile-first viewport: prevents zoom on input focus, respects notch -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1117" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Warehouse Pro" />

    <!-- SEO -->
    <title>Warehouse Pro — Система управления складом и продажами</title>
    <meta name="description" content="Warehouse Pro — SaaS платформа для управления складом, заказами, доставкой и агентами в Узбекистане. Мобильное приложение с офлайн-режимом, GPS-трекинг, аналитика, интеграция с 1С." />
    <meta name="keywords" content="склад, управление складом, warehouse management, заказы, доставка, агенты, GPS трекинг, офлайн, Узбекистан, Tashkent, 1С интеграция, SaaS" />
    <meta name="author" content="Warehouse Pro" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.warehouse-pro.uz/" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.warehouse-pro.uz/" />
    <meta property="og:title" content="Warehouse Pro — Управление складом и продажами" />
    <meta property="og:description" content="SaaS платформа для управления складом, заказами, доставкой и агентами. Мобильное приложение с офлайн-режимом и GPS-трекингом." />
    <meta property="og:image" content="https://www.warehouse-pro.uz/icon-512.png" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="Warehouse Pro" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Warehouse Pro — Управление складом и продажами" />
    <meta name="twitter:description" content="SaaS платформа для управления складом, заказами, доставкой и агентами." />
    <meta name="twitter:image" content="https://www.warehouse-pro.uz/icon-512.png" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Warehouse Pro",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web, Android, iOS",
      "description": "SaaS платформа для управления складом, заказами, доставкой и агентами в Узбекистане. Мобильное приложение с офлайн-режимом и GPS-трекингом.",
      "url": "https://www.warehouse-pro.uz",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "UZS",
        "description": "Бесплатный пробный период"
      },
      "featureList": [
        "Управление складом и остатками",
        "Управление заказами и доставкой",
        "GPS-трекинг агентов",
        "Мобильное приложение с офлайн-режимом",
        "Аналитика и отчёты",
        "Интеграция с 1С",
        "Telegram уведомления",
        "Биллинг и подписки"
      ]
    }
    </script>

    <link rel="icon" href="/icon-192.png" type="image/png"/>
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- VitePWA injects its own <link rel="manifest"> (manifest.webmanifest,
         generated from vite.config.ts) at build time. A hand-authored one
         used to sit here too, pointing at a hand-maintained public/manifest.json
         that had drifted from vite.config.ts. Two manifest links is undefined
         behaviour per spec — the browser picks one, and this one (being first
         in the head) is what iOS Safari was reading for "Add to Home Screen." -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
