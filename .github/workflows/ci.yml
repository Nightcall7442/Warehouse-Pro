name: CI
on:
  # Все ветки, а не только main. Раньше работа в ветке не проверялась вовсе:
  # человек узнавал о поломке типов или упавшем тесте уже после слияния, когда
  # чинить дороже. Прогон стоит минуты, слияние сломанного — часы.
  push:
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Именно `npm ci`, а не `npm install`: образ в Dockerfile ставит зависимости
      # строгим `npm ci`, который падает при расхождении package.json и файла
      # блокировки. Пока здесь стоял терпимый `npm install`, сборка оставалась
      # зелёной, а выкладка падала — ровно так и случилось с prom-client:
      # зависимость добавили в package.json, файл блокировки не обновили.
      # Флаг legacy-peer-deps объявлен в .npmrc, но здесь оставлен явно.
      - run: npm ci --legacy-peer-deps
      # ВАЖНО: не `tsc --noEmit`. Корневой tsconfig.json — solution-файл
      # ("files": [] плюс references), и для него --noEmit компилирует пустой
      # набор и выходит с нулём: шаг был зелёным, не проверяя ничего. Ссылки
      # разворачивает только `tsc -b`, и он вызывается из скрипта с храповиком.
      # Каждый шаг через обёртку: логи Actions видны только после входа, а
      # пометки — всем. Без этого упавший прогон снаружи выглядит как
      # «exit code 1» без единой подробности.
      - name: Type check
        run: bash scripts/ci-run.sh "Типы" npm run check
      - name: Lint
        run: bash scripts/ci-run.sh "Линтер" npm run lint
      - name: Test
        run: bash scripts/ci-run.sh "Тесты" npm test
      - name: Build
        run: bash scripts/ci-run.sh "Сборка" npm run build

  # Проверки, которым нужна настоящая MySQL: гонки, блокировки, уникальные
  # индексы. На заглушке они непроверяемы — её разборщик условий считает сырой
  # SQL всегда выполненным, а `FOR UPDATE` там пустышка.
  #
  # Отдельной работой, а не шагом в основной: покрытие здесь не считается.
  # Иначе храповик порогов подтянулся бы к прогону С базой, и обычный прогон
  # без неё начал бы падать.
  real-db:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: warehouse_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Tests against a real MySQL
        run: bash scripts/ci-run.sh "Проверки с базой" npm run test:db
        env:
          TEST_DATABASE_URL: mysql://root:test@127.0.0.1:3306/warehouse_test

  # Сквозные проверки: настоящий браузер, настоящее приложение, настоящая база.
  #
  # Прежний набор в CI не запускался вовсе, и это было видно по нему самому:
  # вход выполнялся под несуществующим в засеве пользователем, ожидался переход
  # на страницу, куда роль не попадает, а baseURL указывал на порт 3000 — там у
  # разработчика обычно другое приложение. Тридцать два шага были обёрнуты в
  # «сделать, если элемент виден», поэтому набор проходил при любом состоянии
  # кода. Ни разу не выполнявшийся набор ничем не отличается от отсутствующего,
  # но выглядит как защита.
  e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: warehouse_e2e
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: mysql://root:test@127.0.0.1:3306/warehouse_e2e
      # Имя именно APP_SECRET: в production сервер завершает работу, если его
      # нет (api/lib/env.ts). Значение одноразовое и живёт только внутри
      # прогона — базу CI создаёт и выбрасывает вместе с ней.
      APP_SECRET: e2e-ephemeral-secret-not-used-anywhere-else
      APP_URL: http://127.0.0.1:3100
      ALLOWED_ORIGINS: http://127.0.0.1:3100
      # Ограничитель по умолчанию — 120 запросов в минуту. Сквозные проверки
      # читают остатки и долги чаще, и упирались бы в него, а не в ошибку.
      RATE_LIMIT_GLOBAL_MAX: "5000"
      # NODE_ENV здесь нарочно не задан: с production npm install пропустил бы
      # dev-зависимости, и не встало бы ни Playwright, ни Vite. Приложению его
      # ставит скрипт запуска, а Playwright — конфигурация webServer.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium

      # Схема ставится тем же способом, что и для проверок с настоящей базой
      # (drizzle-kit push), а журнал миграций сразу отмечается заполненным.
      #
      # Приложение при старте накатывает миграции само и отказывается стартовать
      # при неудаче. Накатить их с нуля сейчас нельзя — это видно по отдельному
      # потоку test-migrations, он красный. Без отметки в журнале стартующее
      # приложение попыталось бы применить всю цепочку поверх готовой схемы и
      # упало бы на первой же существующей таблице.
      #
      # Так две разные проверки развязаны: сквозные проверяют поведение
      # приложения, применимость миграций проверяет свой поток. Иначе одно
      # чинилось бы ценой невозможности запустить другое.
      - name: Схема и засев
        run: |
          bash scripts/ci-run.sh "Схема" npx drizzle-kit push --force
          bash scripts/ci-run.sh "Журнал миграций" node scripts/e2e-baseline-journal.mjs
          bash scripts/ci-run.sh "Засев" npm run db:seed

      - name: Сборка
        run: bash scripts/ci-run.sh "Сборка" npm run build

      - name: Прогон
        run: bash scripts/ci-run.sh "Сквозные проверки" npm run test:e2e

      # Playwright кладёт разбор каждого падения отдельным файлом. Он короткий
      # и содержит именно то, чего не хватает в общем выводе: что ожидали, что
      # получили и на каком шаге. Печатается пометкой, потому что логи Actions
      # видны только после входа.
      - name: Разбор падений
        if: failure()
        run: |
          for f in test-results/*/error-context.md; do
            [ -e "$f" ] || continue
            echo "----- $f"
            head -c 1500 "$f"
            echo
          done > /tmp/ctx.txt 2>&1 || true
          if [ -s /tmp/ctx.txt ]; then
            cat /tmp/ctx.txt
            bash scripts/ci-run.sh "Разбор падений" bash -c "cat /tmp/ctx.txt; exit 1" || true
          else
            echo "разборов не найдено"
          fi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-отчёт
          path: |
            playwright-report/
            test-results/
          retention-days: 7
