name: Test migrations
# Запускается и на правку самого потока или его скрипта наката: иначе
# сломанный шаг проверки узнали бы только в PR со следующей миграцией.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "db/migrations/**"
      - "db/schema.ts"
      - "drizzle.config.ts"
      - ".github/workflows/test-migrations.yml"
      - "scripts/migrate.cjs"
  pull_request:
    branches: [main]
    paths:
      - "db/migrations/**"
      - "db/schema.ts"
      - "drizzle.config.ts"
      - ".github/workflows/test-migrations.yml"
      - "scripts/migrate.cjs"

jobs:
  migrate-fresh:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: warehouse_pro_migrate_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Именно `npm ci`, а не `npm install`: образ в Dockerfile ставит зависимости
      # строгим `npm ci`, который падает при расхождении package.json и файла
      # блокировки. Пока здесь стоял терпимый `npm install`, сборка оставалась
      # зелёной, а выкладка падала — ровно так и случилось с prom-client:
      # зависимость добавили в package.json, файл блокировки не обновили.
      # Флаг legacy-peer-deps объявлен в .npmrc, но здесь оставлен явно.
      - run: npm ci --legacy-peer-deps

      # Весь смысл задания: цепочка миграций целиком (0000 и дальше) встаёт на
      # пустую базу той же версии, что в бою. Это поймало бы 0022–0029, так и
      # не записанные в журнал, пока их не починили.
      #
      # Накат — тем же migrate() из drizzle-orm, что зовёт сервер при запуске
      # (scripts/migrate.cjs), а не `drizzle-kit migrate`: тот при падении
      # выходит с кодом 1, не напечатав причины (проверено 29.09.2026 на
      # 0.31.11). Здесь этот шаг назывался временным отладочным
      # (debug-migrate.cjs) и стоял перед `drizzle-kit migrate` «на пустую
      # базу» — который из-за него накатывал уже накатанное и не проверял
      # ничего. Теперь накат с нуля — один шаг, и он с причиной; drizzle-kit
      # проверяется в конце, на накатанной базе, а с нуля его гоняет стенд
      # real-db в ci.yml на каждом прогоне.
      - name: Миграции с нуля — тем же migrate(), что при запуске сервера
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/warehouse_pro_migrate_test
        run: bash scripts/ci-run.sh "Миграции с нуля" node scripts/migrate.cjs

      # Spot-check a few things that previously silently failed to apply
      # (order_items.cost_price and onec_config were undocumented manual
      # changes with no migration file until this was fixed) — a clean exit
      # code alone wouldn't have caught those, since IF NOT EXISTS guards can
      # mask a statement that never ran for an unrelated reason.
      - name: Verify expected schema objects exist
        run: |
          mysql -h 127.0.0.1 -u root warehouse_pro_migrate_test -e "
            SELECT 'order_items.cost_price' AS check_name, COUNT(*) AS ok FROM information_schema.COLUMNS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'order_items' AND COLUMN_NAME = 'cost_price'
            UNION ALL
            SELECT 'onec_config table', COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'onec_config'
            UNION ALL
            SELECT 'visit_schedules table', COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'visit_schedules'
            UNION ALL
            SELECT 'agent_territories table', COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'agent_territories'
            UNION ALL
            SELECT 'sales_targets.territory_id', COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'sales_targets' AND COLUMN_NAME = 'territory_id'
            UNION ALL
            SELECT 'warehouse_stock 3-col unique index', COUNT(*) FROM information_schema.STATISTICS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'warehouse_stock' AND INDEX_NAME = 'uq_stock_product_warehouse_tenant';
          "
          # Fail the job if any check above returned 0.
          missing=$(mysql -h 127.0.0.1 -u root -N -B warehouse_pro_migrate_test -e "
            SELECT COUNT(*) FROM (
              SELECT COUNT(*) AS c FROM information_schema.COLUMNS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'order_items' AND COLUMN_NAME = 'cost_price'
              UNION ALL SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'onec_config'
              UNION ALL SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'visit_schedules'
              UNION ALL SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'agent_territories'
              UNION ALL SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'sales_targets' AND COLUMN_NAME = 'territory_id'
              UNION ALL SELECT COUNT(*) FROM information_schema.STATISTICS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'warehouse_stock' AND INDEX_NAME = 'uq_stock_product_warehouse_tenant'
            ) checks WHERE c = 0;
          ")
          if [ "$missing" -ne 0 ]; then
            echo "::error::$missing expected schema object(s) missing after migrate — see table above"
            exit 1
          fi

      # Снимок схемы в db/migrations/meta не должен отставать от db/schema.ts.
      #
      # drizzle-kit сравнивает schema.ts не с базой, а со своим последним
      # снимком. Миграцию, написанную руками без снимка, он не видит — и
      # следующий `db:generate` выписывает её содержимое ЗАНОВО, вместе с
      # чужой правкой. Так и вышло с 0002: файл есть, снимка нет, и очередная
      # генерация выдала «ALTER TABLE tenant_branding MODIFY favicon_url»
      # второй раз. На боевой базе такая миграция падает на дубликате, а
      # падение миграции останавливает запуск сервера.
      #
      # Проверка простая: генерация на актуальном коде не должна выписывать
      # ничего. Появился файл — снимок отстал.
      - name: Схема и снимок миграций не разошлись
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/warehouse_pro_migrate_test
        run: |
          before=$(ls db/migrations/*.sql | wc -l)
          npx drizzle-kit generate --name drift_probe
          after=$(ls db/migrations/*.sql | wc -l)
          if [ "$after" -ne "$before" ]; then
            echo "::error::drizzle-kit generate выписал новую миграцию — снимок в db/migrations/meta отстал от db/schema.ts. Сгенерируйте миграцию через npm run db:generate вместо того, чтобы писать SQL руками, и закоммитьте снимок вместе с ней."
            cat db/migrations/*drift_probe*.sql
            exit 1
          fi

      # Re-run migrate against the now-migrated database — через drizzle-kit,
      # то есть тем путём, которым идут `npm run db:migrate` и стенд real-db.
      # drizzle-kit tracks applied migrations in __drizzle_migrations and
      # skips them, so this
      # mainly guards against the command itself erroring on a second run
      # (e.g. a missing journal/snapshot file) rather than re-exercising every
      # statement's idempotency — that was verified manually against a
      # database seeded to look like production's untracked history (see
      # docs/audit-2026-08-01.md) rather than in this CI job, since faking
      # "schema already matches but migrations were never tracked" reliably
      # here would need scripting drizzle's internal tracking-table format.
      - name: Re-run migrate (should be a fast no-op)
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/warehouse_pro_migrate_test
        run: npx drizzle-kit migrate
