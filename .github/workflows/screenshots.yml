# Снимки экранов для обучения — с настоящего приложения на засеве.
#
# Запускается руками (workflow_dispatch). Поднимает MySQL с засевом demo-uz,
# собирает веб и, если удаётся, мобилку в веб (Expo web), и прогоняет
# scripts/screenshots.mjs по ролям и языкам. Результат — артефакт
# «screenshots» (PNG + index.json), из него собирается руководство
# docs/training. Ни одна проверка здесь не ломает сборку: снимок — материал.
name: Screenshots

on:
  # Пуш в любую ветку docs/* с правкой сценариев или выносок — новые снимки;
  # руками — workflow_dispatch с любой ветки (файл уже в main).
  push:
    branches: ["docs/**"]
    paths: [".github/workflows/screenshots.yml", "scripts/screenshots.mjs", "scripts/screenshot-marks.json", "scripts/landing-shots-collect.mjs", "db/seed.ts", "docs/training/**", "scripts/manual_content.py", "scripts/build_manual.py"]
  workflow_dispatch:
    inputs:
      mobile_ref:
        description: "Ветка мобилки (Warehouse-Pro-Mobile) для снимков; пусто — без мобилки"
        default: "master"
        required: false
      langs:
        description: "Языки через запятую"
        default: "ru,uz"
        required: false

jobs:
  shoot:
    runs-on: ubuntu-latest
    # Ветки docs/landing-*: чистые снимки для лендинга коммитятся в ту же ветку
    # (артефакт закрытого репозитория без входа не скачать).
    permissions:
      contents: write
    services:
      mysql:
        image: mysql:9.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: warehouse_shots
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: mysql://root:test@127.0.0.1:3306/warehouse_shots
      APP_SECRET: screenshots-ephemeral-secret-not-used-anywhere-else
      APP_URL: http://127.0.0.1:3100
      # Мобилка в вебе живёт на 8081 и ходит в API с другого источника.
      ALLOWED_ORIGINS: http://127.0.0.1:3100,http://127.0.0.1:8081,http://localhost:8081
      RATE_LIMIT_GLOBAL_MAX: "5000"
      PORT: "3100"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        if: ${{ (inputs.mobile_ref || 'master') != '' }}
        with:
          repository: Nightcall7442/Warehouse-Pro-Mobile
          ref: ${{ inputs.mobile_ref || 'master' }}
          path: mobile
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y -q webp

      # Тот же путь, что у сквозных проверок: схема push-ем, журнал отмечен, засев.
      - name: Схема и засев
        run: |
          npx drizzle-kit push --force
          node scripts/e2e-baseline-journal.mjs
          npm run db:seed

      - name: Сборка и запуск веба
        run: |
          npm run build
          NODE_ENV=production nohup node dist/boot.js > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3100/health/ready && break; sleep 2; done
          curl -sf http://127.0.0.1:3100/health/ready || { echo "веб не поднялся"; tail -50 /tmp/web.log; exit 1; }

      # Мобилка в веб: Expo web. Не поднялась — снимки веба всё равно будут.
      - name: Мобилка в веб
        id: mobile
        if: ${{ (inputs.mobile_ref || 'master') != '' }}
        continue-on-error: true
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: http://127.0.0.1:3100
        run: |
          npm ci --legacy-peer-deps
          npx expo export --platform web --output-dir dist
          nohup npx -y serve -s dist -l 8081 > /tmp/mobile.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8081/ >/dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:8081/ >/dev/null || { echo "мобилка не поднялась"; tail -30 /tmp/mobile.log; exit 1; }
          echo "url=http://127.0.0.1:8081" >> "$GITHUB_OUTPUT"

      - name: Снимки
        env:
          WEB_URL: http://127.0.0.1:3100
          MOBILE_URL: ${{ steps.mobile.outputs.url }}
          LANGS: ${{ inputs.langs || 'ru,uz' }}
          OUT: screenshots
          # Лендингу — ×2 (Retina); руководству — 1, его выноски считаны в CSS-пикселях.
          SHOT_SCALE: ${{ startsWith(github.ref, 'refs/heads/docs/landing') && '2' || '1' }}
          MOBILE_TALL: ${{ startsWith(github.ref, 'refs/heads/docs/landing') && '1' || '' }}
        run: node scripts/screenshots.mjs

      # Чистые кадры для лендинга — в ветку. Только на docs/landing-*: у
      # руководства свой путь через артефакт и выноски.
      - name: Снимки для лендинга — в ветку
        if: startsWith(github.ref, 'refs/heads/docs/landing')
        run: |
          # Кадры — во временную папку; ветка тем временем могла уехать вперёд
          # (правки лендинга, соседний прогон), поэтому коммитим поверх свежего
          # origin, а не поверх того, что было при старте.
          node scripts/landing-shots-collect.mjs screenshots /tmp/landing-shots
          git config user.name "screenshots-bot"
          git config user.email "screenshots-bot@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          rm -rf docs/landing/shots && mkdir -p docs/landing && cp -r /tmp/landing-shots docs/landing/shots
          git add docs/landing/shots
          git commit -m "Снимки для лендинга — с настоящего приложения (CI)" || { echo "нечего коммитить"; exit 0; }
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # Руководство — тоже в ветку, на docs/manual-*: артефакт закрытого
      # репозитория без входа не скачать, а собирать книгу руками с чужого
      # артефакта — значит держать её всегда на шаг позади снимков.
      - name: Руководство — в ветку
        if: startsWith(github.ref, 'refs/heads/docs/manual')
        run: |
          pip3 install --quiet pillow
          git config user.name "screenshots-bot"
          git config user.email "screenshots-bot@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          SHOTS=screenshots python3 scripts/build_manual.py
          git add docs/manual
          git commit -m "Руководство: пересобрано со свежими снимками (CI)" || { echo "нечего коммитить"; exit 0; }
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Журнал сервера при провалах
        if: always()
        run: |
          echo "----- index"; cat screenshots/index.json | head -80 || true
          echo "----- web.log (хвост)"; tail -40 /tmp/web.log || true
          echo "----- mobile.log (хвост)"; tail -40 /tmp/mobile.log 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14

# Снимок «Оформить подробно» у курьера требует правки order.getById (PR #19).
