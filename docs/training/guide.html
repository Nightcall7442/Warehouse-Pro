<title>Warehouse Pro: руководство по ролям</title>
<style>
:root{--bg:#f6f4ef;--panel:#ffffff;--ink:#22201c;--muted:#6b665c;--line:#e2ddd2;--accent:#1f6f78;--accent-ink:#ffffff;--chip:#eef3f2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#17161a;--panel:#201f24;--ink:#ece9e2;--muted:#a39e93;--line:#34323a;--accent:#5fb3bb;--accent-ink:#0f1a1c;--chip:#26303a}}
:root[data-theme="dark"]{--bg:#17161a;--panel:#201f24;--ink:#ece9e2;--muted:#a39e93;--line:#34323a;--accent:#5fb3bb;--accent-ink:#0f1a1c;--chip:#26303a}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "Manrope","Segoe UI",system-ui,sans-serif;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 80px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:8px}
h1{font-size:26px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--ink);padding:8px 16px;font:inherit;font-weight:600;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.note{color:var(--muted);margin:0 0 20px}
nav.toc{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 28px}
nav.toc a{background:var(--chip);color:var(--ink);text-decoration:none;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600}
section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin:0 0 18px}
section h2{margin:0 0 6px;font-size:20px}
section .intro{color:var(--muted);margin:0 0 16px;max-width:70ch}
ol{margin:0;padding-left:22px;display:grid;gap:18px}
li{max-width:70ch}
figure{margin:10px 0 0;display:grid;gap:6px}
figure img{width:100%;height:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
figure.mobile img{max-width:320px}
figure figcaption{color:var(--muted);font-size:12px}
footer{color:var(--muted);font-size:12px;margin-top:30px}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: no-preference){section{scroll-margin-top:12px}}
</style>

<header>

<script>
const DATA = [{"key": "start", "ru": "Как начать", "uz": "Qanday boshlash", "intro": {"ru": "Вход один для всех ролей: адрес компании, e-mail и пароль. После входа каждый видит только свои экраны. Язык переключается внизу меню (веб) или в профиле (телефон).", "uz": "Kirish barcha rollar uchun bir xil: kompaniya manzili, e-mail va parol. Kirgandan so'ng har kim faqat o'z ekranlarini ko'radi. Til menyuning pastida (veb) yoki profilda (telefon) almashtiriladi."}, "steps": [{"n": 1, "ru": "Веб: откройте адрес компании, введите e-mail и пароль. Если включена двухфакторная защита — код из приложения.", "uz": "Veb: kompaniya manzilini oching, e-mail va parolni kiriting. Ikki bosqichli himoya yoqilgan bo'lsa — ilovadagi kod.", "img": {"ru": "img/web/ru/login/login.webp", "uz": "img/web/uz/login/login.webp"}, "kind": "web"}, {"n": 2, "ru": "Телефон: тот же e-mail и пароль. Приложение запоминает вход; повторный вход — по отпечатку или Face ID.", "uz": "Telefon: o'sha e-mail va parol. Ilova kirishni eslab qoladi; qayta kirish — barmoq izi yoki Face ID orqali.", "img": {"ru": "img/mobile/ru/agent/login.webp", "uz": "img/mobile/uz/agent/login.webp"}, "kind": "mobile"}, {"n": 3, "ru": "Язык: в вебе — кнопки РУС / UZB внизу меню; на телефоне — Профиль → Язык.", "uz": "Til: vebda — menyu pastidagi РУС / UZB tugmalari; telefonda — Profil → Til.", "img": {"ru": "img/mobile/ru/agent/profile.webp", "uz": "img/mobile/uz/agent/profile.webp"}, "kind": "mobile"}]}, {"key": "operator", "ru": "Оператор офиса и склад", "uz": "Ofis operatori va ombor", "intro": {"ru": "Оператор живёт в «Заказах»: принимает и проверяет заказы агентов, собирает погрузочные листы, отдаёт рейсы курьерам, проводит приходы и возвраты.", "uz": "Operator «Buyurtmalar»da ishlaydi: agentlarning buyurtmalarini qabul qilib tekshiradi, yuklash varaqalarini yig'adi, reyslarni kuryerlarga beradi, kirim va qaytarishlarni o'tkazadi."}, "steps": [{"n": 1, "ru": "Заказы. Сводка одной строкой — каждое число фильтр: «Ожидает» — заказы, которые ждут решения офиса (например, скидка выше порога). Клик по строке открывает панель заказа; в панели у ожидающего — причина и кнопки «Подтвердить / Отклонить».", "uz": "Buyurtmalar. Bir qatorli xulosa — har bir raqam filtr: «Kutmoqda» — ofis qarorini kutayotgan buyurtmalar (masalan, chegirma chegaradan yuqori). Qatorga bosilsa buyurtma paneli ochiladi; kutayotgan buyurtmada — sabab va «Tasdiqlash / Rad etish» tugmalari.", "img": {"ru": "img/web/ru/operator/orders.webp", "uz": "img/web/uz/operator/orders.webp"}, "kind": "web"}, {"n": 2, "ru": "Новый заказ по звонку: магазин (поиск по названию, владельцу, телефону; рядом долг), товары (видно «свободно N»), способ оплаты — готово.", "uz": "Qo'ng'iroq bo'yicha yangi buyurtma: do'kon (nomi, egasi, telefoni bo'yicha qidiruv; yonida qarz), tovarlar («bo'sh N» ko'rinadi), to'lov usuli — tayyor.", "img": {"ru": null, "uz": null}, "kind": "web"}, {"n": 3, "ru": "Погрузочный лист: отметьте заказы галочками → «Погрузочные листы» → «Сформировать лист» → печать. Лист держит свои заказы, пока не закрыт; собрать их второй раз нельзя.", "uz": "Yuklash varaqasi: buyurtmalarni belgilang → «Yuklash varaqalari» → «Varaqa tuzish» → chop etish. Varaqa yopilguncha o'z buyurtmalarini ushlab turadi; ularni ikkinchi marta yig'ib bo'lmaydi.", "img": {"ru": null, "uz": null}, "kind": null}, {"n": 4, "ru": "Сборка по строкам: в списке листов у листа «готовится» — кнопка «Собрать». Строки: нужно / партии (по FEFO — те же, что спишет отгрузка) / собрано. Меньше нужного — недостача: она видна в списке и уходит офису уведомлением. Затем — курьер на весь лист одним выбором.", "uz": "Qatorlar bo'yicha yig'ish: varaqalar ro'yxatida «tayyorlanmoqda» varaqada — «Yig'ish» tugmasi. Qatorlar: kerak / partiyalar (FEFO bo'yicha — jo'natishda hisobdan chiqariladigan o'shalar) / yig'ildi. Kerakdan kam — kamomad: u ro'yxatda ko'rinadi va ofisga bildirishnoma bo'lib boradi. So'ng — butun varaqaga bitta tanlov bilan kuryer.", "img": {"ru": null, "uz": null}, "kind": null}, {"n": 5, "ru": "Приход товара: «Приходы» → новая накладная, товар по коду или сканером, партия и срок годности → «Сохранить и завершить». Остаток меняется только после завершения.", "uz": "Tovar kirimi: «Kirim» → yangi nakladnoy, tovar kodi yoki skaner bilan, partiya va yaroqlilik muddati → «Saqlash va yakunlash». Qoldiq faqat yakunlangandan keyin o'zgaradi.", "img": {"ru": "img/web/ru/operator/arrivals.webp", "uz": "img/web/uz/operator/arrivals.webp"}, "kind": "web"}, {"n": 6, "ru": "Склад: остатки, партии и сроки; «Отчёты по складу» — что сгорает. Возвраты от магазинов проводит офис; возврат поставщику — из карточки поставщика в «Приходах».", "uz": "Ombor: qoldiqlar, partiyalar va muddatlar; «Ombor hisobotlari» — nima yaroqsiz bo'lmoqda. Do'konlardan qaytarishlarni ofis o'tkazadi; yetkazib beruvchiga qaytarish — «Kirim»dagi yetkazib beruvchi kartasidan.", "img": {"ru": "img/web/ru/operator/warehouse.webp", "uz": "img/web/uz/operator/warehouse.webp"}, "kind": "web"}, {"n": 7, "ru": "Штрих-коды: печать этикеток на товары и по приходу; сканер-клавиатура работает везде, где есть поле поиска товара («код + Enter»).", "uz": "Shtrix-kodlar: tovarlarga va kirim bo'yicha yorliqlar chop etish; skaner-klaviatura tovar qidiruvi bor har joyda ishlaydi («kod + Enter»).", "img": {"ru": "img/web/ru/operator/barcode.webp", "uz": "img/web/uz/operator/barcode.webp"}, "kind": "web"}]}, {"key": "ceo", "ru": "Директор", "uz": "Direktor", "intro": {"ru": "Пять вопросов директора — на первом экране: сколько продали и довезли сегодня, кто должен, что сгорает на складе, кто из агентов не работает, что с зарплатой.", "uz": "Direktorning beshta savoli — birinchi ekranda: bugun qancha sotildi va yetkazildi, kim qarzdor, omborda nima yaroqsiz bo'lmoqda, agentlardan kim ishlamayapti, oylik bilan nima gap."}, "steps": [{"n": 1, "ru": "Главная: выручка и заказы за сегодня (стрелка — к вчера), «довезено N из M», долг клиентов, маржа. Алерты ниже кликаются: просрочка — в отчёты по складу, долг — в «Долги».", "uz": "Bosh sahifa: bugungi tushum va buyurtmalar (strelka — kechaga nisbatan), «yetkazildi N / M», mijozlar qarzi, marja. Pastdagi ogohlantirishlar bosiladi: muddati o'tgan — ombor hisobotlariga, qarz — «Qarzlar»ga.", "img": {"ru": "img/web/ru/ceo/dashboard.webp", "uz": "img/web/uz/ceo/dashboard.webp"}, "kind": "web"}, {"n": 2, "ru": "KPI агентов: таблица с баллами, продажами, визитами; клик по агенту — разбор и его зарплата за период. Колонка «GPS» — у кого нет следов на карте.", "uz": "Agentlar KPI: ballar, sotuvlar, tashriflar jadvali; agentga bosilsa — tahlil va uning davr uchun oyligi. «GPS» ustuni — kimning xaritada izi yo'q.", "img": {"ru": "img/web/ru/ceo/kpi.webp", "uz": "img/web/uz/ceo/kpi.webp"}, "kind": "web"}, {"n": 3, "ru": "Карта: кто на связи, кто был раньше, кто без сигнала; маршрут агента за день, фото визитов, «подмена координат» — красным.", "uz": "Xarita: kim aloqada, kim oldin bo'lgan, kim signalsiz; agentning kunlik yo'nalishi, tashrif fotolari, «koordinatalar almashtirilgan» — qizil.", "img": {"ru": "img/web/ru/ceo/map.webp", "uz": "img/web/uz/ceo/map.webp"}, "kind": "web"}, {"n": 4, "ru": "Отчёты и долги: «Долги» — кто, сколько и как давно; строка ведёт в карточку магазина. P&L — заработали или потеряли за период.", "uz": "Hisobotlar va qarzlar: «Qarzlar» — kim, qancha va qachondan beri; qator do'kon kartasiga olib boradi. P&L — davr uchun foyda yoki zarar.", "img": {"ru": "img/web/ru/ceo/reports-debts.webp", "uz": "img/web/uz/ceo/reports-debts.webp"}, "kind": "web"}, {"n": 5, "ru": "Зарплаты: фонд, начислено и выдано; «Выдать всем» с подтверждением получения сотрудником на телефоне. Настройка оклада и процентов — там же.", "uz": "Oyliklar: fond, hisoblangan va berilgan; «Hammaga berish» — xodim telefonda olganini tasdiqlaydi. Maosh va foizlar sozlamasi — o'sha yerda.", "img": {"ru": "img/web/ru/ceo/salaries.webp", "uz": "img/web/uz/ceo/salaries.webp"}, "kind": "web"}, {"n": 6, "ru": "Пользователи и журнал действий: кто что сделал — отмена заказа, сторно оплаты, смена лимита; фильтры «Заказы / Оплаты / Магазины».", "uz": "Foydalanuvchilar va amallar jurnali: kim nima qildi — buyurtma bekor qilindi, to'lov storno qilindi, limit o'zgardi; «Buyurtmalar / To'lovlar / Do'konlar» filtrlari.", "img": {"ru": "img/web/ru/ceo/audit-log.webp", "uz": "img/web/uz/ceo/audit-log.webp"}, "kind": "web"}]}, {"key": "supervisor", "ru": "Супервайзер", "uz": "Supervayzer", "intro": {"ru": "Утро — карта: кто вышел. Месяц — планы визитов одной кнопкой. Вечер — разбор дня по координатам.", "uz": "Ertalab — xarita: kim ishga chiqdi. Oy — bitta tugma bilan tashrif rejalari. Kechqurun — koordinatalar bo'yicha kun tahlili."}, "steps": [{"n": 1, "ru": "Карта (веб): состав команды целиком — «На связи / Были раньше / Без сигнала»; у каждого — обход x/y за день и % нормы.", "uz": "Xarita (veb): butun jamoa — «Aloqada / Oldin bo'lgan / Signalsiz»; har birida — kunlik aylanish x/y va norma foizi.", "img": {"ru": "img/web/ru/supervisor/map.webp", "uz": "img/web/uz/supervisor/map.webp"}, "kind": "web"}, {"n": 2, "ru": "Планы: вкладка «Месяц» — агент, территория, дни недели → «Расставить»; вкладка «День» — «Как прошёл день»: время в точках, километры, замечания.", "uz": "Rejalar: «Oy» bo'limi — agent, hudud, hafta kunlari → «Joylashtirish»; «Kun» bo'limi — «Kun qanday o'tdi»: nuqtalardagi vaqt, kilometrlar, izohlar.", "img": {"ru": "img/web/ru/supervisor/plans.webp", "uz": "img/web/uz/supervisor/plans.webp"}, "kind": "web"}, {"n": 3, "ru": "Телефон: «Карта», «Планы», «Нормы» — то же в дороге.", "uz": "Telefon: «Xarita», «Rejalar», «Normalar» — yo'lda ham o'sha.", "img": {"ru": "img/mobile/ru/supervisor/map.webp", "uz": "img/mobile/uz/supervisor/map.webp"}, "kind": "mobile"}]}, {"key": "agent", "ru": "Торговый агент (телефон)", "uz": "Savdo agenti (telefon)", "intro": {"ru": "30–60 визитов в день. Главная — визиты и долги; заказ у прилавка за минуту; всё работает без связи и отправляется само.", "uz": "Kuniga 30–60 tashrif. Bosh sahifa — tashriflar va qarzlar; peshtaxta oldida bir daqiqada buyurtma; hammasi aloqasiz ishlaydi va o'zi jo'natiladi."}, "steps": [{"n": 1, "ru": "Главная: визиты на сегодня (строка ведёт в магазин), плитка «Долги» — кому идти собирать, выручка и заказы за день.", "uz": "Bosh sahifa: bugungi tashriflar (qator do'konga olib boradi), «Qarzlar» plitkasi — kimdan undirish kerak, kunlik tushum va buyurtmalar.", "img": {"ru": "img/mobile/ru/agent/home.webp", "uz": "img/mobile/uz/agent/home.webp"}, "kind": "mobile"}, {"n": 2, "ru": "Магазины: ближайшие первыми, корзина на карточке — заказ в один тап. Новый магазин заводится прямо у точки.", "uz": "Do'konlar: yaqinlari birinchi, kartadagi savat — bir teginishda buyurtma. Yangi do'kon nuqtaning o'zida ochiladi.", "img": {"ru": "img/mobile/ru/agent/shops.webp", "uz": "img/mobile/uz/agent/shops.webp"}, "kind": "mobile"}, {"n": 3, "ru": "Новый заказ — три шага: магазин → товары (поиск, сканер, «− n +», виден остаток) → оплата и обещанный срок → Подтвердить.", "uz": "Yangi buyurtma — uch qadam: do'kon → tovarlar (qidiruv, skaner, «− n +», qoldiq ko'rinadi) → to'lov va va'da qilingan muddat → Tasdiqlash.", "img": {"ru": null, "uz": null}, "kind": "mobile"}, {"n": 4, "ru": "Без связи: список магазинов и каталог берутся из копии на телефоне (с датой), заказ ложится в очередь и уходит сам. В «Заказах» отложенные видны карточками «ожидает отправки».", "uz": "Aloqasiz: do'konlar ro'yxati va katalog telefondagi nusxadan olinadi (sanasi bilan), buyurtma navbatga tushadi va o'zi jo'natiladi. «Buyurtmalar»da kechiktirilganlar «jo'natish kutilmoqda» kartalari bilan ko'rinadi.", "img": {"ru": "img/mobile/ru/agent/orders.webp", "uz": "img/mobile/uz/agent/orders.webp"}, "kind": "mobile"}, {"n": 5, "ru": "План: «Готово» отмечает визит (с фото или без); без связи отметка сохраняется и уйдёт сама. Долги: список должников, звонок в один тап.", "uz": "Reja: «Tayyor» tashrifni belgilaydi (foto bilan yoki fotosiz); aloqasiz belgi saqlanadi va o'zi ketadi. Qarzlar: qarzdorlar ro'yxati, bir teginishda qo'ng'iroq.", "img": {"ru": "img/mobile/ru/agent/debts.webp", "uz": "img/mobile/uz/agent/debts.webp"}, "kind": "mobile"}, {"n": 6, "ru": "Зарплата: начислено за период, выдано на руки — «Получил» подтверждает выплату.", "uz": "Oylik: davr uchun hisoblangan, qo'lga berilgan — «Oldim» to'lovni tasdiqlaydi.", "img": {"ru": "img/mobile/ru/agent/salary.webp", "uz": "img/mobile/uz/agent/salary.webp"}, "kind": "mobile"}]}, {"key": "courier", "ru": "Курьер (телефон)", "uz": "Kuryer (telefon)", "intro": {"ru": "Утром — «Выехал по всем». У точки — сумма наличных и «Доставлено», либо «Не доставлено» с причиной, либо «Оформить подробно» для частичной оплаты и возврата. Всё — без связи.", "uz": "Ertalab — «Hammasiga yo'lga chiqdim». Nuqtada — naqd summa va «Yetkazildi», yoki sababi bilan «Yetkazilmadi», yoki qisman to'lov va qaytarish uchun «Batafsil rasmiylashtirish». Hammasi — aloqasiz."}, "steps": [{"n": 1, "ru": "Доставки: сверху «Ожидают N · В пути M», кнопка «Выехал по всем». Карточка: адрес, «На карте» (маршрут по координатам), сумма, состав заказа.", "uz": "Yetkazishlar: yuqorida «Kutmoqda N · Yo'lda M», «Hammasiga yo'lga chiqdim» tugmasi. Karta: manzil, «Xaritada» (koordinatalar bo'yicha yo'nalish), summa, buyurtma tarkibi.", "img": {"ru": "img/mobile/ru/courier/deliveries.webp", "uz": "img/mobile/uz/courier/deliveries.webp"}, "kind": "mobile"}, {"n": 2, "ru": "Частичный возврат оформляется вместе с деньгами: что вернулось по позициям, сколько заплатили за оставшееся, когда доплатят. Дату можно писать как привыкли — 15.09.2026.", "uz": "Qisman qaytarish pul bilan birga rasmiylashtiriladi: qaysi tovarlar qaytdi, qolgani uchun qancha to'landi, qachon qo'shimcha to'lanadi. Sanani odatdagidek yozish mumkin — 15.09.2026.", "img": {"ru": null, "uz": null}, "kind": null}, {"n": 3, "ru": "Отметка, которую сервер отклонил (например, заказ уже закрыт), показывает причину и кнопки «Повторить / Убрать». Зарплата — на Главной.", "uz": "Server rad etgan belgi (masalan, buyurtma allaqachon yopilgan) sababi va «Qayta / Olib tashlash» tugmalarini ko'rsatadi. Oylik — Bosh sahifada.", "img": {"ru": "img/mobile/ru/courier/home.webp", "uz": "img/mobile/uz/courier/home.webp"}, "kind": "mobile"}]}, {"key": "merchandiser", "ru": "Мерчандайзер (телефон)", "uz": "Merchandayzer (telefon)", "intro": {"ru": "План на день → в точке «Готово» открывает отчёт: фото полки, чек-лист товаров с ценой и акцией, заметки.", "uz": "Kunlik reja → nuqtada «Tayyor» hisobotni ochadi: javon fotosi, narx va aksiya bilan tovarlar ro'yxati, izohlar."}, "steps": [{"n": 1, "ru": "Главная и План: только визиты, магазины и профиль — без чужих блоков про продажи.", "uz": "Bosh sahifa va Reja: faqat tashriflar, do'konlar va profil — sotuv haqidagi begona bloklarsiz.", "img": {"ru": "img/mobile/ru/merchandiser/plan.webp", "uz": "img/mobile/uz/merchandiser/plan.webp"}, "kind": "mobile"}, {"n": 2, "ru": "Отчёт о визите: снимок с камеры, отметки по товарам, «Завершить визит». Черновик хранится сутки, если отвлеклись.", "uz": "Tashrif hisoboti: kameradan surat, tovarlar bo'yicha belgilar, «Tashrifni yakunlash». Chalg'isangiz, qoralama bir kun saqlanadi.", "img": {"ru": "img/mobile/ru/merchandiser/home.webp", "uz": "img/mobile/uz/merchandiser/home.webp"}, "kind": "mobile"}]}];
const TXT = {
  ru: { title: "Warehouse Pro — руководство по ролям", note: "Снимки сделаны с настоящего приложения на демонстрационных данных (организация «Demo UZ»).", cap: "Снимок экрана", foot: "Собрано автоматически из текущей сборки; при изменении экранов снимки обновляются тем же прогоном." },
  uz: { title: "Warehouse Pro — rollar bo'yicha qo'llanma", note: "Suratlar haqiqiy ilovadan namunaviy ma'lumotlarda olingan («Demo UZ» tashkiloti).", cap: "Ekran surati", foot: "Joriy yig'ilmadan avtomatik tuzilgan; ekranlar o'zgarsa, suratlar o'sha prognoz bilan yangilanadi." },
};
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function render(lang){
  document.documentElement.lang = lang;
  document.getElementById("ttl").textContent = TXT[lang].title;
  document.getElementById("note").textContent = TXT[lang].note;
  document.getElementById("foot").textContent = TXT[lang].foot;
  document.getElementById("toc").innerHTML = DATA.map(s => `<a href="#${s.key}">${esc(s[lang])}</a>`).join("");
  document.getElementById("body").innerHTML = DATA.map(s => `
    <section id="${s.key}"><h2>${esc(s[lang])}</h2><p class="intro">${esc(s.intro[lang])}</p><ol>
      ${s.steps.map(st => `<li>${esc(st[lang])}${st.img[lang] ? `<figure class="${st.kind}"><img loading="lazy" src="${st.img[lang]}" alt="${esc(TXT[lang].cap)}: ${esc(s[lang])} ${st.n}"><figcaption>${esc(TXT[lang].cap)} ${st.n}</figcaption></figure>` : ""}</li>`).join("")}
    </ol></section>`).join("");
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  try { localStorage.setItem("guide-lang", lang); } catch {}
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => render(b.dataset.lang)));
let start = "ru"; try { const s = localStorage.getItem("guide-lang"); if (s === "uz") start = "uz"; } catch {}
render(start);
</script>
