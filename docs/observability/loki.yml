# Настройка Loki для официального образа grafana/loki.
#
# ── Зачем понадобилась ───────────────────────────────────────────────────────
#
# Служба была развёрнута из стороннего репозитория, и он пропал: на странице
# настроек Railway пишет «GitHub Repo not found». Пока Loki работает на уже
# собранном образе, но пересобрать его нечем — любая перевыкладка оставила бы
# проект без сбора журналов, и починить было бы неоткуда.
#
# Поэтому служба переводится на официальный образ, а настройка переезжает сюда,
# в репозиторий, где она под версионным контролем и видна глазами.
#
# ── Что сохранено от прежней установки ───────────────────────────────────────
#
# Том примонтирован в /loki, и все пути ниже ведут туда же — накопленные
# журналы остаются на месте. Хранилище tsdb с таблицами index_*, как и было:
# это видно в журнале прежней службы («index-store=tsdb», «table-name=index_20694»).
#
# Оговорка честности ради: точную схему прежней установки я вижу только по
# косвенным признакам. Новые записи будут читаться наверняка; если старые
# окажутся недоступны для поиска, дело в несовпадении версии схемы — тогда
# нужно добавить вторую запись в schema_config с прежней датой.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  # Одна копия: служба одна, распределять не между кем.
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Тридцать суток. Журналы старше редко нужны, а место они занимают.
  retention_period: 720h
  # Записи из офлайн-очереди приходят пачкой и могут быть старыми — отвергать
  # их по возрасту нельзя, иначе потеряем ровно то, ради чего очередь заведена.
  reject_old_samples: false

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
