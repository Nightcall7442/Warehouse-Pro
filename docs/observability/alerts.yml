# Правила тревог для Warehouse Pro.
#
# ── Как это попадает в Prometheus ────────────────────────────────────────────
#
# Служба Prometheus в Railway развёрнута из готового образа, без репозитория,
# поэтому её настройка живёт в команде запуска: та пишет файлы и запускает
# процесс. Этот файл — читаемый исходник; однострочник для команды запуска
# порождается из него скриптом scripts/build-prometheus-command.mjs, чтобы они
# не разошлись при правке.
#
# ── О порогах ────────────────────────────────────────────────────────────────
#
# Пороги подобраны так, чтобы тревога означала «иди смотри», а не «шумит».
# Сообщение, которое приходит слишком часто, перестают читать — и тогда
# пропускают настоящую аварию. Если какая-то тревога зазвенит без причины,
# правильнее поднять её порог, а не отключить.

groups:
  - name: warehouse-pro
    rules:
      # ── Приложение не отвечает ───────────────────────────────────────────
      - alert: ПриложениеНеОтвечает
        expr: up{job="warehouse-pro"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Warehouse Pro не отвечает"
          description: >-
            Prometheus не может снять метрики уже 2 минуты. Либо приложение
            упало, либо перестало отдавать /metrics. Проверьте журнал службы
            Warehouse-Pro в Railway.

      # ── Ошибки сервера ───────────────────────────────────────────────────
      # Именно ДОЛЯ, а не количество: сотня ошибок на миллион запросов и сотня
      # на тысячу означают совершенно разное.
      - alert: МногоОшибокСервера
        expr: >-
          sum(rate(http_request_errors_total[5m]))
          / clamp_min(sum(rate(http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Больше 5% запросов падают с ошибкой"
          description: >-
            Пятая часть часа с долей пятисотых выше 5%. Смотрите таблицу
            «Где сыплются ошибки» на дашборде — там видно, какая ручка.

      # ── Медленные ответы ─────────────────────────────────────────────────
      # p95, а не среднее: среднее прячет хвост, а человек судит по нему.
      - alert: ОтветыСтализамедленные
        expr: >-
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Каждый двадцатый запрос дольше 2 секунд"
          description: >-
            p95 времени ответа держится выше 2 секунд десять минут. Обычно это
            база: долгий запрос или нехватка соединений в пуле.

      # ── Цикл событий ─────────────────────────────────────────────────────
      # Главный показатель здоровья Node: растёт раньше, чем время ответа.
      - alert: ЦиклСобытийЗадыхается
        expr: nodejs_eventloop_lag_p99_seconds > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Цикл событий стоит дольше 200 мс"
          description: >-
            Что-то долго считается в основном потоке и держит все остальные
            запросы. Частые причины: разбор огромного JSON, обработка
            изображения, выгрузка отчёта без разбивки на части.

      # ── Память ───────────────────────────────────────────────────────────
      # Порог намеренно щедрый: обычная работа около 160 МиБ. Если тревога
      # окажется шумной — поднимайте порог, а не выключайте правило.
      - alert: ПамятьРастётБезСпада
        expr: process_resident_memory_bytes > 400 * 1024 * 1024
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Процесс держит больше 400 МиБ"
          description: >-
            Обычный расход около 160 МиБ. Пятнадцать минут выше 400 — похоже на
            утечку: соединения или таймеры, которые никто не закрывает.
            Посмотрите панель «Открытые дескрипторы и запросы».

      - alert: КопияБазыУстарела
        expr: absent(backup_last_success_timestamp_seconds) or (time() - backup_last_success_timestamp_seconds > 26 * 3600)
        for: 26h
        labels:
          severity: critical
        annotations:
          summary: "Ночная копия базы не снималась больше суток"
          description: >-
            Метрика backup_last_success_timestamp_seconds отсутствует или старше
            26 часов. Ночная копия идёт в 03:00 по Ташкенту; после перезапуска
            приложения метрика появляется только со следующей копией — поэтому
            выдержка 26 часов. Проверить: журнал работы backup в Loki, переменные
            S3_* и BACKUP_S3_* в Railway, кнопку копии в мониторинге суперадмина.

      - alert: РаботаПоРасписаниюНеУдаётся
        expr: time() - cron_last_success_timestamp_seconds{job!~"backup|restore-drill|telegram-outbox|low-stock-alerts"} > 26 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Ежедневная работа {{ $labels.job }} не удавалась больше суток"
          description: >-
            Планировщик догоняет пропущенное сам (раз в час после назначенного
            времени), так что сутки без удачи — это не перезапуск, а работа,
            которая падает раз за разом. Смотреть журнал «cron job failed» в Loki
            и колонку last_error в таблице cron_runs. У копии базы и репетиции
            восстановления свои правила ниже.

      - alert: РепетицияВосстановленияУстарела
        expr: absent(backup_restore_drill_last_success_timestamp_seconds) or (time() - backup_restore_drill_last_success_timestamp_seconds > 8 * 86400)
        for: 8d
        labels:
          severity: warning
        annotations:
          summary: "Копия базы не разворачивалась больше недели"
          description: >-
            Работа restore-drill (воскресенье 05:00 по Ташкенту) берёт последнюю
            копию из хранилища, разворачивает её в черновую базу на том же сервере
            и сверяет число строк с записанным при снятии. Метрика отсутствует
            или старше восьми дней: копия могла перестать разворачиваться, а
            узнать об этом в день аварии — поздно. Смотреть журнал работы
            restore-drill в Loki.

  # ── База и Redis (нужны экспортёры, docs/observability/exporters.md) ──────
  - name: mysql-redis
    rules:
      - alert: СоединенийСБазойПочтиПредел
        expr: mysql_global_status_threads_connected / mysql_global_variables_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Соединений с MySQL больше 80 % от предела"
          description: >-
            Пул приложения плюс кроны и репетиция восстановления подбираются к
            max_connections. Дальше — «Too many connections» и отказ старта.
            Смотреть DB_CONNECTION_LIMIT приложения и max_connections базы.

      - alert: МедленныеЗапросыРастут
        expr: rate(mysql_global_status_slow_queries[10m]) > 0.1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "MySQL пишет медленные запросы чаще шести в минуту"
          description: >-
            Обычно это отчёт без индекса или большой экспорт. Сверить со
            trpc_procedure_duration_seconds — какая процедура тормозит.

      - alert: RedisПочтиБезПамяти
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9 and redis_memory_max_bytes > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis занял больше 90 % отведённой памяти"
          description: >-
            Кэш и лимиты запросов живут в Redis; при нехватке памяти он
            начинает вытеснять ключи или отказывать в записи — приложение
            переходит на память процесса и одна реплика перестаёт быть равна
            другой.

      - alert: RedisНедоступен
        expr: redis_up == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Redis не отвечает экспортёру"
          description: >-
            Отзыв сессий, лимиты и кэш перешли в память процесса. Проверить
            службу Redis в Railway.

  # ── Процедуры tRPC ──────────────────────────────────────────────────────────
  - name: trpc
    rules:
      - alert: ПроцедураОтказывает
        expr: >-
          sum by (path) (rate(trpc_procedure_errors_total{code="INTERNAL_SERVER_ERROR"}[10m]))
          / sum by (path) (rate(trpc_procedure_duration_seconds_count[10m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Процедура {{ $labels.path }} падает внутренней ошибкой чаще 5 %"
          description: >-
            Не отказ по существу (те идут другими кодами), а именно падение.
            Смотреть журнал по path в Loki и Sentry.

      - alert: ПроцедураМедленная
        expr: histogram_quantile(0.95, sum by (path, le) (rate(trpc_procedure_duration_seconds_bucket[10m]))) > 2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Процедура {{ $labels.path }}: 95-й перцентиль дольше двух секунд"
          description: >-
            Человек ждёт экран больше двух секунд в одном вызове из двадцати.
            Обычно отчёт без индекса; сверить с медленными запросами MySQL.

