# Правила тревог для Warehouse Pro.
#
# ── Как это попадает в Prometheus ────────────────────────────────────────────
#
# Служба Prometheus в Railway развёрнута из готового образа, без репозитория,
# поэтому её настройка живёт в команде запуска: та пишет файлы и запускает
# процесс. Этот файл — читаемый исходник; однострочник для команды запуска
# порождается из него скриптом scripts/build-prometheus-command.mjs, чтобы они
# не разошлись при правке.
#
# ── О порогах ────────────────────────────────────────────────────────────────
#
# Пороги подобраны так, чтобы тревога означала «иди смотри», а не «шумит».
# Сообщение, которое приходит слишком часто, перестают читать — и тогда
# пропускают настоящую аварию. Если какая-то тревога зазвенит без причины,
# правильнее поднять её порог, а не отключить.

groups:
  - name: warehouse-pro
    rules:
      # ── Приложение не отвечает ───────────────────────────────────────────
      - alert: ПриложениеНеОтвечает
        expr: up{job="warehouse-pro"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Warehouse Pro не отвечает"
          description: >-
            Prometheus не может снять метрики уже 2 минуты. Либо приложение
            упало, либо перестало отдавать /metrics. Проверьте журнал службы
            Warehouse-Pro в Railway.

      # ── Ошибки сервера ───────────────────────────────────────────────────
      # Именно ДОЛЯ, а не количество: сотня ошибок на миллион запросов и сотня
      # на тысячу означают совершенно разное.
      - alert: МногоОшибокСервера
        expr: >-
          sum(rate(http_request_errors_total[5m]))
          / clamp_min(sum(rate(http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Больше 5% запросов падают с ошибкой"
          description: >-
            Пятая часть часа с долей пятисотых выше 5%. Смотрите таблицу
            «Где сыплются ошибки» на дашборде — там видно, какая ручка.

      # ── Медленные ответы ─────────────────────────────────────────────────
      # p95, а не среднее: среднее прячет хвост, а человек судит по нему.
      - alert: ОтветыСтализамедленные
        expr: >-
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Каждый двадцатый запрос дольше 2 секунд"
          description: >-
            p95 времени ответа держится выше 2 секунд десять минут. Обычно это
            база: долгий запрос или нехватка соединений в пуле.

      # ── Цикл событий ─────────────────────────────────────────────────────
      # Главный показатель здоровья Node: растёт раньше, чем время ответа.
      - alert: ЦиклСобытийЗадыхается
        expr: nodejs_eventloop_lag_p99_seconds > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Цикл событий стоит дольше 200 мс"
          description: >-
            Что-то долго считается в основном потоке и держит все остальные
            запросы. Частые причины: разбор огромного JSON, обработка
            изображения, выгрузка отчёта без разбивки на части.

      # ── Память ───────────────────────────────────────────────────────────
      # Порог намеренно щедрый: обычная работа около 160 МиБ. Если тревога
      # окажется шумной — поднимайте порог, а не выключайте правило.
      - alert: ПамятьРастётБезСпада
        expr: process_resident_memory_bytes > 400 * 1024 * 1024
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Процесс держит больше 400 МиБ"
          description: >-
            Обычный расход около 160 МиБ. Пятнадцать минут выше 400 — похоже на
            утечку: соединения или таймеры, которые никто не закрывает.
            Посмотрите панель «Открытые дескрипторы и запросы».
